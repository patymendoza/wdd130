<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Chili River Adventures</title>
    <meta name="description" content="Contact Chili River Adventures in Arequipa to book your rafting excursion, ask any questions, or find out what is included in our packages.">
    <meta name="author" content="Patricia Mendoza">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.webp" alt="Chili River Adventures logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="company-info">
            <h1>Chili River Adventures</h1>
            <address>
                <p>106 Melgar Street</p>
                <p>Arequipa, Peru</p>
                <p>+51 53 000 000</p>
                <p>info@chiliriveradventures.com</p>
            </address>
        </section>
        <div class="contact-grid">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d956.8898511603071!2d-71.53411114577183!3d-16.3963917539403!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91424a5103bdfe4b%3A0x1c1a3b3772984b39!2sMelgar%20106%2C%20Arequipa%2004001!5e0!3m2!1ses-419!2spe!4v1795652871289!5m2!1ses-419!2spe" width="400" height="300" title="Map of Chili River Adventures location" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <fieldset>
                    <legend>Message Purpose:</legend>

                    <input type="radio" id="general" name="purpose" value="general">
                    <label for="general">General Inquiry</label>

                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    <label for="reservation">Reservation Question</label>

                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
                <div class="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>

            </form>
        </div>
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.webp" alt="Young woman guiding a rafting trip">
                <figcaption>Carolina Lazo de la Vega - Head River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.webp" alt="Excited guide rafting through the rapids">
                <figcaption>Luis Morales - Rafting Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.webp" alt="Smiling rafting guide">
                <figcaption>Caleb Mendoza - Safety Instructor</figcaption>
            </figure>

        </section>

    </main>
    <footer>
        <p>©2026, Chili River Adventures, Patricia Mendoza</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
            <a href="https://youtube.com">
                <img src="images/youtube.svg" alt="Youtube Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
